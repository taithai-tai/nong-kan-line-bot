<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ตั้งค่า Admin | น้องก้าน</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f6f3ee;
      color: #201f1d;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(680px, calc(100vw - 32px));
      background: #fff;
      border: 1px solid #ded8cf;
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 18px 48px rgba(41, 34, 25, .08);
    }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { line-height: 1.7; color: #5f5a52; }
    code {
      display: block;
      margin-top: 14px;
      padding: 14px;
      border-radius: 8px;
      background: #f2eee7;
      color: #201f1d;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <h1>ยังไม่ได้เปิดหน้า Admin</h1>
    <p>ตั้งค่า Environment Variable ชื่อ <strong>ADMIN_PASSWORD</strong> ใน Railway หรือไฟล์ .env ก่อนใช้งานหน้าแก้ไขข้อมูลค่ะ</p>
    <code>ADMIN_PASSWORD=ใส่รหัสผ่านที่เดายาก</code>
  </main>
</body>
</html>
